name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Create the release before parallel artifact uploads
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME --verify-tag --title "PoE Personal Trade $($env:GITHUB_REF_NAME.TrimStart('v'))" --notes "Windows downloads are attached below."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Windows editions
        run: pnpm exec electron-builder --win nsis portable --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
